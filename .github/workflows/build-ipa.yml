name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          # 新版本 XcodeGen 默认写 Xcode16 的工程格式(77), 云端 Xcode15 读不了
          # 统一降回 objectVersion 60, 兼容所有版本
          python3 - <<'PY'
          import re
          p = "FunctionPlotter.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"objectVersion = \d+;", "objectVersion = 60;", s)
          s = re.sub(r"preferredProjectObjectVersion = \d+;", "preferredProjectObjectVersion = 60;", s)
          open(p, "w", encoding="utf-8").write(s)
          print("objectVersion normalized to 60")
          PY
          xcodebuild -version

      - name: 编译 (不签名)
        run: |
          set -o pipefail
          xcodebuild \
            -project FunctionPlotter.xcodeproj \
            -target FunctionPlotter \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -120

      - name: 打包成 ipa
        run: |
          set -e
          APP=$(find . -name "FunctionPlotter.app" -type d -not -path "*/Index.noindex/*" | head -1)
          echo "found app: $APP"
          test -n "$APP"
          rm -rf Payload FunctionPlotter.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FunctionPlotter.ipa Payload
          ls -lh FunctionPlotter.ipa
          unzip -l FunctionPlotter.ipa | head -20

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FunctionPlotter-ipa
          path: FunctionPlotter.ipa
